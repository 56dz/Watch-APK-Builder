<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- 安卓手表软件编辑器 icon: Android watch + hammer -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#2E7D6B"/>
  <!-- watch strap -->
  <rect x="68" y="20" width="60" height="216" rx="14" fill="#1B4D42" stroke="#0F2E27" stroke-width="6"/>
  <!-- crown -->
  <rect x="156" y="116" width="16" height="24" rx="5" fill="#B0BEC5" stroke="#0F2E27" stroke-width="5"/>
  <!-- case + dial -->
  <circle cx="98" cy="128" r="66" fill="#ECEFF1" stroke="#0F2E27" stroke-width="7"/>
  <circle cx="98" cy="128" r="51" fill="#263238"/>
  <!-- android head -->
  <g stroke="#3DDC84" stroke-width="7" stroke-linecap="round">
    <line x1="80" y1="112" x2="70" y2="96"/>
    <line x1="116" y1="112" x2="126" y2="96"/>
  </g>
  <path d="M60,150 A38,38 0 0 1 136,150 Z" fill="#3DDC84"/>
  <circle cx="83" cy="134" r="6" fill="#263238"/>
  <circle cx="113" cy="134" r="6" fill="#263238"/>
  <!-- hammer, head up-right, handle down -->
  <g transform="translate(-30 14) rotate(30 190 140)">
    <rect x="179" y="80" width="22" height="148" rx="9" fill="#D08B4A" stroke="#4E2E12" stroke-width="6"/>
    <rect x="157" y="50" width="70" height="38" rx="8" fill="#455A64" stroke="#ECEFF1" stroke-width="7"/>
    <rect x="161" y="54" width="15" height="30" rx="3" fill="#37474F"/>
  </g>
</svg>
